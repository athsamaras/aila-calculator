<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AILA risk calculator</title>
<meta name="description" content="AILA: risk of death after discharge from a cardiology department. Research and educational use.">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202b;--muted:#5b6672;--line:#d9dee5;--brand:#0b5cab;--brand2:#e8f1fb;--low:#1a7f4f;--mid:#b26a00;--high:#b3261e;--lowbg:#e6f4ec;--midbg:#fdf1dc;--highbg:#fbe9e7;--focus:#ffbf47}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--brand)}
header{background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.35rem;margin:0;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:.95rem}
.lang button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:44px}
.lang button[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.btn:focus-visible,.lang button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.notice{background:var(--brand2);border:1px solid #c5dcf5;border-radius:10px;padding:10px 14px;margin:16px 0;font-size:.95rem}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:20px;align-items:start;padding-bottom:40px}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:1.05rem;margin:0 0 4px}
.card p.sub{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:.93rem;margin-bottom:4px}
.hint{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
input,select{font:inherit;width:100%;padding:9px 10px;border:1px solid #aeb7c2;border-radius:8px;background:#fff;color:var(--ink);min-height:44px}
.row{display:flex;gap:8px}.row>*{flex:1}.row>select.unit{flex:0 0 50%;font-size:.9rem;padding-left:6px;padding-right:2px}
.warn{color:var(--mid);font-size:.84rem;margin-top:3px;min-height:1em}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
#results{position:sticky;top:12px}
@media (max-width:900px){#results{position:static}}
.badge{border-radius:12px;padding:14px 16px;margin:8px 0 12px;border:1px solid transparent}
.badge b{font-size:1.25rem;display:block}
.low{background:var(--lowbg);border-color:#bfe3cf;color:#0f5132}.mid{background:var(--midbg);border-color:#f3d7a2;color:#6b3f00}.high{background:var(--highbg);border-color:#f3c4bf;color:#7a1712}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:#e4e8ee;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.contrib{display:grid;grid-template-columns:minmax(120px,42%) 1fr 54px;gap:6px 8px;align-items:center;font-size:.88rem}
.cbar{position:relative;height:12px;background:linear-gradient(to right,transparent 49.6%,#9aa5b1 49.6%,#9aa5b1 50.4%,transparent 50.4%)}
.cbar i{position:absolute;top:1px;height:10px;border-radius:3px}
.muted{color:var(--muted);font-size:.9rem}
details{border-top:1px solid var(--line);padding:10px 0}details summary{cursor:pointer;font-weight:600}
footer{color:var(--muted);font-size:.85rem;padding:18px 0 40px}
@media print{header .lang,.actions,.notice,details:not([open]){display:none}body{background:#fff}main{display:block}.card{border:0;padding:6px 0}}
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="brand"><h1>AILA</h1><span data-i18n="tagline"></span></div>
  <div class="lang" role="group" aria-label="Language"><button type="button" id="lang-en" aria-pressed="true">English</button> <button type="button" id="lang-el" aria-pressed="false">Ελληνικά</button></div>
</div></header>
<div class="wrap">
<div class="notice" data-i18n="notice"></div>
<main>
<section aria-label="Inputs">
  <div class="card">
    <h2 data-i18n="s_setting"></h2><p class="sub" data-i18n="s_setting_sub"></p>
    <label for="setting" data-i18n="l_setting"></label>
    <select id="setting">
      <option value="gr" data-i18n="o_gr"></option><option value="uk" data-i18n="o_uk"></option><option value="nl" data-i18n="o_nl"></option><option value="de" data-i18n="o_de"></option><option value="us" data-i18n="o_us"></option><option value="other" data-i18n="o_other"></option><option value="custom" data-i18n="o_custom"></option>
    </select>
    <div id="customwrap" hidden style="margin-top:10px"><label for="customhr"><span data-i18n="l_customhr"></span><span class="hint" data-i18n="h_customhr"></span></label><input id="customhr" type="number" inputmode="decimal" min="0.05" max="5" step="0.01" placeholder="0.50"></div>
  </div>
  <div class="card">
    <h2 data-i18n="s_adm"></h2><p class="sub" data-i18n="s_adm_sub"></p>
    <div class="grid">
      <div><label for="age"><span data-i18n="l_age"></span></label><input id="age" type="number" inputmode="decimal" min="18" max="110" step="1"><div class="warn" id="w_age"></div></div>
      <div><label for="hf" data-i18n="l_hf"></label><select id="hf"><option value="" data-i18n="o_choose"></option><option value="0" data-i18n="o_hf0"></option><option value="1" data-i18n="o_hf1"></option><option value="2" data-i18n="o_hf2"></option></select></div>
      <div><label for="vhd"><span data-i18n="l_vhd"></span><span class="hint" data-i18n="h_vhd"></span></label><select id="vhd"><option value="" data-i18n="o_choose"></option><option value="0" data-i18n="o_vhd0"></option><option value="1" data-i18n="o_vhd1"></option><option value="2" data-i18n="o_vhd2"></option></select></div>
      <div><label for="egfr"><span data-i18n="l_egfr"></span><span class="hint">mL/min/1.73 m²</span></label><input id="egfr" type="number" inputmode="decimal" min="1" max="200" step="1"><div class="warn" id="w_egfr"></div></div>
      <div><label for="hba" data-i18n="l_hba"></label><div class="row"><input id="hba" type="number" inputmode="decimal" step="0.1"><select id="hbu" class="unit" aria-label="Haemoglobin unit"><option value="gdl">g/dL</option><option value="gl">g/L</option><option value="mmol">mmol/L</option></select></div><div class="warn" id="w_hba"></div></div>
      <div><label for="dm" data-i18n="l_dm"></label><select id="dm"><option value="" data-i18n="o_choose"></option><option value="0" data-i18n="o_no"></option><option value="1" data-i18n="o_yes"></option></select></div>
      <div><label for="lung"><span data-i18n="l_lung"></span><span class="hint" data-i18n="h_lung"></span></label><select id="lung"><option value="" data-i18n="o_choose"></option><option value="0" data-i18n="o_no"></option><option value="1" data-i18n="o_yes"></option></select></div>
    </div>
  </div>
  <div class="card" id="card_dis">
    <h2 data-i18n="s_dis"></h2><p class="sub" data-i18n="s_dis_sub"></p>
    <div class="grid">
      <div><label for="hbd"><span data-i18n="l_hbd"></span><span class="hint" data-i18n="h_sameunit"></span></label><input id="hbd" type="number" inputmode="decimal" step="0.1"><div class="warn" id="w_hbd"></div></div>
      <div><label for="los"><span data-i18n="l_los"></span><span class="hint" data-i18n="h_days"></span></label><input id="los" type="number" inputmode="decimal" min="1" max="365" step="1"><div class="warn" id="w_los"></div></div>
      <div><label for="dx" data-i18n="l_dx"></label><select id="dx"><option value="" data-i18n="o_choose"></option><option value="1" data-i18n="o_dx1"></option><option value="3" data-i18n="o_dx3"></option><option value="4" data-i18n="o_dx4"></option><option value="2" data-i18n="o_dx2"></option></select></div>
      <div><label for="nlr"><span data-i18n="l_nlr"></span><span class="hint" data-i18n="h_nlr"></span></label><input id="nlr" type="number" inputmode="decimal" min="0.1" max="100" step="0.1"><div class="row" style="margin-top:6px"><input id="neut" type="number" inputmode="decimal" step="0.01" aria-label="Neutrophils" data-i18n-ph="p_neut"><input id="lymph" type="number" inputmode="decimal" step="0.01" aria-label="Lymphocytes" data-i18n-ph="p_lymph"></div><div class="warn" id="w_nlr"></div></div>
    </div>
  </div>
  <div class="card" id="card_max">
    <h2 data-i18n="s_max"></h2><p class="sub" data-i18n="s_max_sub"></p>
    <div class="grid">
      <div><label for="bua" data-i18n="l_bua"></label><div class="row"><input id="bua" type="number" inputmode="decimal" step="0.1"><select id="buu" class="unit" aria-label="Urea unit"><option value="bun" data-i18n="o_bun"></option><option value="ureamg" data-i18n="o_ureamg"></option><option value="ureammol" data-i18n="o_ureammol"></option></select></div><div class="warn" id="w_bua"></div></div>
      <div><label for="bud"><span data-i18n="l_bud"></span><span class="hint" data-i18n="h_sameunit"></span></label><input id="bud" type="number" inputmode="decimal" step="0.1"><div class="warn" id="w_bud"></div></div>
      <div><label for="np"><span data-i18n="l_np"></span><span class="hint" data-i18n="h_optional"></span></label><div class="row"><input id="np" type="number" inputmode="decimal" step="1"><select id="npt" class="unit" aria-label="Natriuretic peptide"><option value="nt_pg">NT-proBNP, pg/mL</option><option value="nt_pmol">NT-proBNP, pmol/L</option><option value="bnp_pg">BNP, pg/mL</option><option value="bnp_pmol">BNP, pmol/L</option></select></div></div>
      <div><label for="alb"><span data-i18n="l_alb"></span><span class="hint" data-i18n="h_optional"></span></label><div class="row"><input id="alb" type="number" inputmode="decimal" step="0.1"><select id="albu" class="unit" aria-label="Albumin unit"><option value="gdl">g/dL</option><option value="gl">g/L</option></select></div><div class="warn" id="w_alb"></div></div>
    </div>
  </div>
  <div class="actions"><button class="btn primary" type="button" id="calc" data-i18n="b_calc"></button><button class="btn" type="button" id="example" data-i18n="b_example"></button><button class="btn" type="button" id="reset" data-i18n="b_reset"></button><button class="btn" type="button" id="print" data-i18n="b_print"></button></div>
</section>
<section id="results" aria-live="polite" aria-label="Results">
  <div class="card"><h2 data-i18n="s_res"></h2><div id="out"><p class="muted" data-i18n="r_empty"></p></div></div>
  <div class="card">
    <details><summary data-i18n="d_about"></summary><div data-i18n="d_about_t"></div></details>
    <details><summary data-i18n="d_valid"></summary><div id="validtable"></div><p class="muted" data-i18n="d_valid_n"></p></details>
    <details><summary data-i18n="d_limits"></summary><div data-i18n="d_limits_t"></div></details>
    <details><summary data-i18n="d_privacy"></summary><div data-i18n="d_privacy_t"></div></details>
  </div>
</section>
</main>
<footer><span data-i18n="footer"></span> <span id="build"></span></footer>
</div>

en:{tagline:"Risk of death after discharge from a cardiology department",notice:"<b>For research and education.</b> This tool is not a medical device and does not replace clinical judgement. Outside Greece, predicted probabilities are valid only with a baseline for the local setting; the risk group can be used in any setting.",s_setting:"1. Setting",s_setting_sub:"The ranking of patients is the same everywhere. The baseline risk is not, so choose the setting closest to yours.",l_setting:"Where is the patient treated?",o_gr:"Greece, cardiology inpatients (development setting)",o_uk:"United Kingdom, cardiology inpatients (London cohort)",o_nl:"Netherlands, cardiology inpatients (Amsterdam cohort)",o_de:"Germany, cardiology outpatients (Hamburg cohort)",o_us:"United States, cardiovascular hospitalisations (New York cohort)",o_other:"Another or unknown setting",o_custom:"I have a local baseline (hazard ratio)",l_customhr:"Local baseline hazard ratio",h_customhr:"From a local validation: baseline hazard relative to the development cohort (1 = same).",s_adm:"2. At admission",s_adm_sub:"All seven items are needed.",l_age:"Age (years)",l_hf:"Heart failure",o_choose:"Choose…",o_hf0:"No heart failure",o_hf1:"Yes, ejection fraction 40% or more, or not known",o_hf2:"Yes, ejection fraction below 40%",l_vhd:"Significant valve disease",h_vhd:"At least moderate stenosis or regurgitation",o_vhd0:"None",o_vhd1:"One valve",o_vhd2:"More than one valve",l_egfr:"eGFR at admission",l_hba:"Haemoglobin at admission",l_dm:"Diabetes",l_lung:"Chronic lung disease",h_lung:"For example COPD",o_no:"No",o_yes:"Yes",s_dis:"3. At discharge (optional)",s_dis_sub:"Fill in all four items to use the 11-item model.",l_hbd:"Haemoglobin at discharge",h_sameunit:"Same unit as above",l_los:"Length of stay",h_days:"Days in hospital",l_dx:"Main diagnosis at discharge",o_dx1:"Coronary artery disease",o_dx3:"Arrhythmia",o_dx4:"Heart failure, valve disease, or pulmonary hypertension",o_dx2:"Other cardiac diagnosis",l_nlr:"Neutrophil-to-lymphocyte ratio at discharge",h_nlr:"Enter the ratio, or the two counts below",p_neut:"Neutrophils",p_lymph:"Lymphocytes",s_max:"4. Additional blood tests (optional)",s_max_sub:"With urea at admission and discharge, the 15-item model is used. Natriuretic peptide and albumin can be left empty.",l_bua:"Urea or BUN at admission",l_bud:"Urea or BUN at discharge",o_bun:"BUN, mg/dL",o_ureamg:"Urea, mg/dL",o_ureammol:"Urea, mmol/L",l_np:"Natriuretic peptide",l_alb:"Albumin at admission",h_optional:"Optional",b_calc:"Calculate",b_example:"Example patient",b_reset:"Clear",b_print:"Print",s_res:"Result",r_empty:"Enter the seven admission items and press Calculate.",r_missing:"Still needed:",r_model:"Model used",r_m_adm:"AILA-Admission (7 items)",r_m_dis:"AILA-Discharge (11 items)",r_m_max:"AILA-Max (15 items)",r_next_dis:"Add the four discharge items to use AILA-Discharge.",r_next_max:"Add urea at admission and discharge to use AILA-Max.",r_group:"Risk group",g_low:"Low",g_mid:"Intermediate",g_high:"High",r_group_t:"Groups are thirds of the development cohort. Observed 1-year mortality in this group in validation cohorts:",r_prob:"Predicted risk of death after discharge",r_us_note:"In the United States cohort only death in hospital was studied (area under the curve 0.73), so no baseline for death after discharge is available. The range below spans the four settings with follow-up; use the risk group, or obtain a local baseline.",r_prob_other:"No baseline is available for this setting. The range below spans the four validated settings; use the risk group, or obtain a local baseline.",r_h:"Time after discharge",r_p:"Predicted risk",h90:"90 days",h6:"6 months",h1:"1 year",h3:"3 years",h5:"5 years",r_contrib:"What moves this estimate",r_contrib_t:"Each bar compares the patient with the average patient of the development cohort. Bars to the right raise the estimate. These are associations and do not show what would happen if a value were changed.",r_de_note:"In outpatients only AILA-Admission has been evaluated; discharge items are not used.",r_np_med:"Natriuretic peptide not entered: the model's default value was used.",r_alb_med:"Albumin not entered: the model's default value was used.",r_approx:"At 6 months and 1 year, the Amsterdam baseline for AILA-Max was estimated from grouped data.",w_range:"Please check this value and its unit.",w_bun:"High for BUN in mg/dL. Is this urea?",d_about:"About the model",d_about_t:"<p>AILA estimates the risk of death from any cause after discharge from a cardiology department. It has three versions with 7, 11, and 15 routinely collected items, and the calculator uses the largest version that the entered data allow.</p><p>Each version is a penalised Cox model. The linear predictor is the sum of coefficient × (value − mean) / SD over the items, and the predicted risk at time t is 1 − S₀(t)<sup>exp(linear predictor + local shift)</sup>. Coefficients and baseline survival are those in the publication.</p>",d_valid:"Where it was tested",d_valid_n:"C-index of AILA-Admission; E/O is the ratio of expected to observed deaths at 1 year with the Greek baseline (90 days in the trials). Baselines for London, Amsterdam, and Hamburg were estimated in the same cohorts and have not yet been tested in new patients.",d_limits:"Limits",d_limits_t:"<ul><li>Adults discharged alive from a cardiology department. Not for children, and not designed for patients in intensive care at the time of calculation.</li><li>In trial populations with acute heart failure, ranking was weaker (C-index 0.63–0.66); a heart failure model is preferable there.</li><li>Every item is needed for the version in use. The published validation also imputed missing values, which this calculator does not do.</li><li>The estimate describes a group of similar patients and cannot say what will happen to one person.</li></ul>",d_privacy:"Privacy",d_privacy_t:"<p>All calculations run in your browser. Nothing you enter is sent or stored.</p>",footer:"AILA calculator. Research and educational use; not a medical device. Contact: the corresponding author of the publication."},
el:{tagline:"Κίνδυνος θανάτου μετά το εξιτήριο από καρδιολογική κλινική",notice:"<b>Για έρευνα και εκπαίδευση.</b> Το εργαλείο δεν είναι ιατροτεχνολογικό προϊόν και δεν αντικαθιστά την κλινική κρίση. Εκτός Ελλάδας, οι προβλεπόμενες πιθανότητες ισχύουν μόνο με βασικό κίνδυνο για το τοπικό περιβάλλον· η ομάδα κινδύνου μπορεί να χρησιμοποιηθεί παντού.",s_setting:"1. Περιβάλλον",s_setting_sub:"Η κατάταξη των ασθενών είναι ίδια παντού. Ο βασικός κίνδυνος διαφέρει, γι' αυτό επιλέξτε το πλησιέστερο περιβάλλον.",l_setting:"Πού νοσηλεύεται ο ασθενής;",o_gr:"Ελλάδα, νοσηλευόμενοι καρδιολογικής (περιβάλλον ανάπτυξης)",o_uk:"Ηνωμένο Βασίλειο, νοσηλευόμενοι καρδιολογικής (κοόρτη Λονδίνου)",o_nl:"Ολλανδία, νοσηλευόμενοι καρδιολογικής (κοόρτη Άμστερνταμ)",o_de:"Γερμανία, εξωτερικοί καρδιολογικοί ασθενείς (κοόρτη Αμβούργου)",o_us:"Ηνωμένες Πολιτείες, καρδιαγγειακές νοσηλείες (κοόρτη Νέας Υόρκης)",o_other:"Άλλο ή άγνωστο περιβάλλον",o_custom:"Έχω τοπικό βασικό κίνδυνο (λόγος κινδύνου)",l_customhr:"Τοπικός λόγος βασικού κινδύνου",h_customhr:"Από τοπική επικύρωση: βασικός κίνδυνος σε σχέση με την κοόρτη ανάπτυξης (1 = ίδιος).",s_adm:"2. Στην εισαγωγή",s_adm_sub:"Χρειάζονται και τα επτά στοιχεία.",l_age:"Ηλικία (έτη)",l_hf:"Καρδιακή ανεπάρκεια",o_choose:"Επιλέξτε…",o_hf0:"Όχι",o_hf1:"Ναι, κλάσμα εξώθησης 40% ή περισσότερο, ή άγνωστο",o_hf2:"Ναι, κλάσμα εξώθησης κάτω από 40%",l_vhd:"Σημαντική βαλβιδοπάθεια",h_vhd:"Τουλάχιστον μέτρια στένωση ή ανεπάρκεια",o_vhd0:"Καμία",o_vhd1:"Μία βαλβίδα",o_vhd2:"Περισσότερες από μία",l_egfr:"eGFR στην εισαγωγή",l_hba:"Αιμοσφαιρίνη στην εισαγωγή",l_dm:"Σακχαρώδης διαβήτης",l_lung:"Χρόνια πνευμονοπάθεια",h_lung:"Για παράδειγμα ΧΑΠ",o_no:"Όχι",o_yes:"Ναι",s_dis:"3. Στο εξιτήριο (προαιρετικά)",s_dis_sub:"Συμπληρώστε και τα τέσσερα για το μοντέλο των 11 στοιχείων.",l_hbd:"Αιμοσφαιρίνη στο εξιτήριο",h_sameunit:"Ίδια μονάδα με παραπάνω",l_los:"Διάρκεια νοσηλείας",h_days:"Ημέρες στο νοσοκομείο",l_dx:"Κύρια διάγνωση εξόδου",o_dx1:"Στεφανιαία νόσος",o_dx3:"Αρρυθμία",o_dx4:"Καρδιακή ανεπάρκεια, βαλβιδοπάθεια ή πνευμονική υπέρταση",o_dx2:"Άλλη καρδιολογική διάγνωση",l_nlr:"Λόγος ουδετεροφίλων προς λεμφοκύτταρα στο εξιτήριο",h_nlr:"Δώστε τον λόγο ή τις δύο τιμές παρακάτω",p_neut:"Ουδετερόφιλα",p_lymph:"Λεμφοκύτταρα",s_max:"4. Επιπλέον εξετάσεις αίματος (προαιρετικά)",s_max_sub:"Με ουρία εισαγωγής και εξιτηρίου χρησιμοποιείται το μοντέλο των 15 στοιχείων. Νατριουρητικό πεπτίδιο και αλβουμίνη μπορούν να μείνουν κενά.",l_bua:"Ουρία ή BUN στην εισαγωγή",l_bud:"Ουρία ή BUN στο εξιτήριο",o_bun:"BUN, mg/dL",o_ureamg:"Ουρία, mg/dL",o_ureammol:"Ουρία, mmol/L",l_np:"Νατριουρητικό πεπτίδιο",l_alb:"Αλβουμίνη στην εισαγωγή",h_optional:"Προαιρετικό",b_calc:"Υπολογισμός",b_example:"Παράδειγμα ασθενούς",b_reset:"Καθαρισμός",b_print:"Εκτύπωση",s_res:"Αποτέλεσμα",r_empty:"Συμπληρώστε τα επτά στοιχεία εισαγωγής και πατήστε Υπολογισμός.",r_missing:"Λείπουν:",r_model:"Μοντέλο",r_m_adm:"AILA-Admission (7 στοιχεία)",r_m_dis:"AILA-Discharge (11 στοιχεία)",r_m_max:"AILA-Max (15 στοιχεία)",r_next_dis:"Προσθέστε τα τέσσερα στοιχεία εξιτηρίου για το AILA-Discharge.",r_next_max:"Προσθέστε ουρία εισαγωγής και εξιτηρίου για το AILA-Max.",r_group:"Ομάδα κινδύνου",g_low:"Χαμηλός",g_mid:"Ενδιάμεσος",g_high:"Υψηλός",r_group_t:"Οι ομάδες είναι τριτημόρια της κοόρτης ανάπτυξης. Παρατηρούμενη θνητότητα 1 έτους αυτής της ομάδας στις κοόρτες επικύρωσης:",r_prob:"Προβλεπόμενος κίνδυνος θανάτου μετά το εξιτήριο",r_us_note:"Στην κοόρτη των Ηνωμένων Πολιτειών μελετήθηκε μόνο ο ενδονοσοκομειακός θάνατος (εμβαδόν κάτω από την καμπύλη 0.73), άρα δεν υπάρχει βασικός κίνδυνος για θάνατο μετά το εξιτήριο. Το εύρος καλύπτει τα τέσσερα περιβάλλοντα με παρακολούθηση· χρησιμοποιήστε την ομάδα κινδύνου ή αποκτήστε τοπικό βασικό κίνδυνο.",r_prob_other:"Δεν υπάρχει βασικός κίνδυνος για αυτό το περιβάλλον. Το εύρος καλύπτει τα τέσσερα επικυρωμένα περιβάλλοντα· χρησιμοποιήστε την ομάδα κινδύνου ή αποκτήστε τοπικό βασικό κίνδυνο.",r_h:"Χρόνος μετά το εξιτήριο",r_p:"Προβλεπόμενος κίνδυνος",h90:"90 ημέρες",h6:"6 μήνες",h1:"1 έτος",h3:"3 έτη",h5:"5 έτη",r_contrib:"Τι επηρεάζει την εκτίμηση",r_contrib_t:"Κάθε μπάρα συγκρίνει τον ασθενή με τον μέσο ασθενή της κοόρτης ανάπτυξης. Οι μπάρες προς τα δεξιά αυξάνουν την εκτίμηση. Πρόκειται για συσχετίσεις και δεν δείχνουν τι θα συνέβαινε αν άλλαζε μια τιμή.",r_de_note:"Σε εξωτερικούς ασθενείς έχει αξιολογηθεί μόνο το AILA-Admission· τα στοιχεία εξιτηρίου δεν χρησιμοποιούνται.",r_np_med:"Δεν δόθηκε νατριουρητικό πεπτίδιο: χρησιμοποιήθηκε η προκαθορισμένη τιμή του μοντέλου.",r_alb_med:"Δεν δόθηκε αλβουμίνη: χρησιμοποιήθηκε η προκαθορισμένη τιμή του μοντέλου.",r_approx:"Στους 6 μήνες και στο 1 έτος, ο βασικός κίνδυνος του Άμστερνταμ για το AILA-Max εκτιμήθηκε από ομαδοποιημένα δεδομένα.",w_range:"Ελέγξτε την τιμή και τη μονάδα.",w_bun:"Υψηλή τιμή για BUN σε mg/dL. Μήπως είναι ουρία;",d_about:"Σχετικά με το μοντέλο",d_about_t:"<p>Το AILA εκτιμά τον κίνδυνο θανάτου από κάθε αιτία μετά το εξιτήριο από καρδιολογική κλινική. Έχει τρεις εκδοχές με 7, 11 και 15 στοιχεία ρουτίνας και ο υπολογιστής χρησιμοποιεί τη μεγαλύτερη που επιτρέπουν τα δεδομένα.</p><p>Κάθε εκδοχή είναι μοντέλο Cox με ποινή. Ο γραμμικός προβλεπτής είναι το άθροισμα συντελεστής × (τιμή − μέση τιμή) / SD και ο προβλεπόμενος κίνδυνος στον χρόνο t είναι 1 − S₀(t)<sup>exp(γραμμικός προβλεπτής + τοπική μετατόπιση)</sup>. Οι συντελεστές και η βασική επιβίωση είναι της δημοσίευσης.</p>",d_valid:"Πού ελέγχθηκε",d_valid_n:"C-index του AILA-Admission· E/O είναι ο λόγος αναμενόμενων προς παρατηρούμενους θανάτους στο 1 έτος με τον ελληνικό βασικό κίνδυνο (90 ημέρες στις κλινικές δοκιμές). Οι βασικοί κίνδυνοι για Λονδίνο, Άμστερνταμ και Αμβούργο εκτιμήθηκαν στις ίδιες κοόρτες και δεν έχουν ελεγχθεί ακόμη σε νέους ασθενείς.",d_limits:"Περιορισμοί",d_limits_t:"<ul><li>Ενήλικες που εξέρχονται ζωντανοί από καρδιολογική κλινική. Όχι για παιδιά, ούτε για ασθενείς σε εντατική τη στιγμή του υπολογισμού.</li><li>Σε πληθυσμούς κλινικών δοκιμών οξείας καρδιακής ανεπάρκειας η κατάταξη ήταν ασθενέστερη (C-index 0.63–0.66)· εκεί προτιμάται ειδικό μοντέλο.</li><li>Χρειάζονται όλα τα στοιχεία της εκδοχής που χρησιμοποιείται. Στη δημοσιευμένη επικύρωση οι ελλείπουσες τιμές συμπληρώθηκαν στατιστικά, κάτι που ο υπολογιστής δεν κάνει.</li><li>Η εκτίμηση περιγράφει ομάδα παρόμοιων ασθενών και δεν λέει τι θα συμβεί σε ένα άτομο.</li></ul>",d_privacy:"Απόρρητο",d_privacy_t:"<p>Όλοι οι υπολογισμοί γίνονται στον περιηγητή σας. Τίποτα δεν αποστέλλεται ούτε αποθηκεύεται.</p>",footer:"Υπολογιστής AILA. Για έρευνα και εκπαίδευση· δεν είναι ιατροτεχνολογικό προϊόν. Επικοινωνία: ο υπεύθυνος αλληλογραφίας της δημοσίευσης."}};
const VLAB={en:{Age:"Age",HFplusLVEF_Simplified:"Heart failure",SIGNIFICANTsinglemultiVHD:"Valve disease",eGFR_ADM:"eGFR",HBadm:"Haemoglobin, admission",DM:"Diabetes",LungDisease:"Lung disease",HBdis:"Haemoglobin, discharge",log_NLRdis:"Neutrophil-to-lymphocyte ratio",DischargeCatGen_fixed:"Discharge diagnosis",log_Durationofhospitalizationdays:"Length of stay",URadm:"BUN, admission",URdis:"BUN, discharge",log_NP_combined:"Natriuretic peptide",ALBUMINadm:"Albumin"},
el:{Age:"Ηλικία",HFplusLVEF_Simplified:"Καρδιακή ανεπάρκεια",SIGNIFICANTsinglemultiVHD:"Βαλβιδοπάθεια",eGFR_ADM:"eGFR",HBadm:"Αιμοσφαιρίνη εισαγωγής",DM:"Διαβήτης",LungDisease:"Πνευμονοπάθεια",HBdis:"Αιμοσφαιρίνη εξιτηρίου",log_NLRdis:"Λόγος ουδετεροφίλων/λεμφοκυττάρων",DischargeCatGen_fixed:"Διάγνωση εξόδου",log_Durationofhospitalizationdays:"Διάρκεια νοσηλείας",URadm:"BUN εισαγωγής",URdis:"BUN εξιτηρίου",log_NP_combined:"Νατριουρητικό πεπτίδιο",ALBUMINadm:"Αλβουμίνη"}};
let LANG="en";const $=id=>document.getElementById(id);const tr=k=>T[LANG][k]??k;
function applyLang(){document.documentElement.lang=LANG;document.querySelectorAll("[data-i18n]").forEach(e=>e.innerHTML=tr(e.dataset.i18n));document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=tr(e.dataset.i18nPh));$("lang-en").setAttribute("aria-pressed",LANG==="en");$("lang-el").setAttribute("aria-pressed",LANG==="el");validTable();calculate(false)}
const num=id=>{const v=$(id).value.trim().replace(",",".");return v===""?NaN:parseFloat(v)};
const HZ=["90 days","6 months","1 year","3 years","5 years"],HK=["h90","h6","h1","h3","h5"];
const TIER={adm:"AILA-Admission",dis:"AILA-Discharge",max:"AILA-Max"};
function readInputs(){const hbF={gdl:1,gl:0.1,mmol:1.611}[$("hbu").value];const buF={bun:1,ureamg:1/2.1428,ureammol:6.006/2.1428}[$("buu").value];
 const x={Age:num("age"),HFplusLVEF_Simplified:num("hf"),SIGNIFICANTsinglemultiVHD:num("vhd"),eGFR_ADM:num("egfr"),HBadm:num("hba")*hbF,DM:num("dm"),LungDisease:num("lung"),HBdis:num("hbd")*hbF,DischargeCatGen_fixed:num("dx")};
 const los=num("los");x.log_Durationofhospitalizationdays=los>0?Math.log(los):NaN;
 let nlr=num("nlr");const ne=num("neut"),ly=num("lymph");if(!(nlr>0)&&ne>0&&ly>0)nlr=ne/ly;x.log_NLRdis=nlr>0?Math.log(nlr):NaN;
 x.URadm=num("bua")*buF;x.URdis=num("bud")*buF;
 const np=num("np"),npt=$("npt").value;let pg=NaN;if(np>0){pg=np*({nt_pg:1,nt_pmol:8.457,bnp_pg:1,bnp_pmol:3.464}[npt])}
 const uln=npt.startsWith("nt")?125:100;x._npMissing=!(pg>0);x.log_NP_combined=pg>0?Math.log(pg/uln):MODEL.medians.log_NP_combined;
 const alb=num("alb")*({gdl:1,gl:0.1}[$("albu").value]);x._albMissing=!(alb>0);x.ALBUMINadm=alb>0?alb:MODEL.medians.ALBUMINadm;return x}
function warnings(x){const set=(id,bad,msg)=>{$(id).textContent=bad?tr(msg||"w_range"):""};
 set("w_age",x.Age<18||x.Age>110);set("w_egfr",x.eGFR_ADM<3||x.eGFR_ADM>160);set("w_hba",x.HBadm<4||x.HBadm>22);set("w_hbd",x.HBdis<4||x.HBdis>22);
 const los=num("los");set("w_los",los<1||los>365);const nl=Math.exp(x.log_NLRdis);set("w_nlr",nl<0.1||nl>100);
 const isBun=$("buu").value==="bun";set("w_bua",x.URadm<2||x.URadm>150||(isBun&&x.URadm>90),isBun&&x.URadm>90?"w_bun":"w_range");set("w_bud",x.URdis<2||x.URdis>150||(isBun&&x.URdis>90),isBun&&x.URdis>90?"w_bun":"w_range");set("w_alb",!x._albMissing&&(x.ALBUMINadm<1||x.ALBUMINadm>6))}
function chooseTier(x,setting){const has=v=>MODEL.vars[v].every(k=>Number.isFinite(x[k]));const admOk=has("AILA-Admission");if(!admOk)return null;
 if(setting==="de")return "AILA-Admission";if(has("AILA-Max"))return "AILA-Max";if(has("AILA-Discharge"))return "AILA-Discharge";return "AILA-Admission"}
function lpOf(tier,x){let lp=0;const parts=[];for(const k of MODEL.vars[tier]){const [m,s]=MODEL.scaler[k];const c=MODEL.coef[tier][k]*(x[k]-m)/s;lp+=c;parts.push([k,c])}return {lp,parts}}
function shiftFor(setting,tier,h){if(setting==="gr")return 0;if(setting==="custom"){const hr=num("customhr");return hr>0?Math.log(hr):NaN}const s=MODEL.shift[setting];return s&&s[tier]?s[tier][h]:NaN}
function risk(tier,lp,h,shift){return 1-Math.pow(MODEL.s0[tier][h],Math.exp(lp+shift))}
const pct=p=>p<0.001?"<0.1%":p>0.995?">99.5%":(100*p).toFixed(p<0.1?1:0)+"%";
function calculate(announce=true){const out=$("out");const setting0=$("setting").value;const isUS=setting0==="us";const setting=isUS?"other":setting0;$("customwrap").hidden=setting!=="custom";const x=readInputs();warnings(x);
 const tier=chooseTier(x,setting);
 if(!tier){const need=MODEL.vars["AILA-Admission"].filter(k=>!Number.isFinite(x[k])).map(k=>VLAB[LANG][k]);const any=["age","hf","vhd","egfr","hba","dm","lung"].some(i=>$(i).value!=="");out.innerHTML=`<p class="muted">${any?tr("r_missing")+" "+need.join(", ")+".":tr("r_empty")}</p>`;return null}
 const {lp,parts}=lpOf(tier,x);const [t1,t2]=MODEL.thr[tier];const g=lp<=t1?"low":lp<=t2?"mid":"high";
 const key={ "AILA-Admission":"adm","AILA-Discharge":"dis","AILA-Max":"max"}[tier];
 let html=`<p><b>${tr("r_model")}:</b> ${tr("r_m_"+key)}</p>`;
 if(setting==="de"&&MODEL.vars["AILA-Discharge"].every(k=>Number.isFinite(x[k])))html+=`<p class="muted">${tr("r_de_note")}</p>`;
 else if(key==="adm"&&setting!=="de")html+=`<p class="muted">${tr("r_next_dis")}</p>`;else if(key==="dis")html+=`<p class="muted">${tr("r_next_max")}</p>`;
 if(key==="max"){if(x._npMissing)html+=`<p class="muted">${tr("r_np_med")}</p>`;if(x._albMissing)html+=`<p class="muted">${tr("r_alb_med")}</p>`}
 const gi={low:0,mid:1,high:2}[g];const obs=Object.entries(MODEL.groups).filter(([s,v])=>v[tier]).map(([s,v])=>`${MODEL.names[s]} ${(100*v[tier][gi]).toFixed(1)}%`).join("; ");
 html+=`<div class="badge ${g}" id="groupbadge" data-group="${g}" data-lp="${lp.toFixed(6)}"><span>${tr("r_group")}</span><b>${tr("g_"+g)}</b></div><p class="muted">${tr("r_group_t")} ${obs}.</p>`;
 html+=`<h3 style="font-size:1rem;margin:14px 0 6px">${tr("r_prob")}</h3>`;
 let rows="",approx=false;const res={};
 if(setting==="other"){html+=`<p class="muted">${tr(isUS?"r_us_note":"r_prob_other")}</p>`;
  HZ.forEach((h,i)=>{const sets=["gr","uk","nl","de"].filter(s=>s==="gr"||(MODEL.shift[s][tier]&&Number.isFinite(MODEL.shift[s][tier][h])));const v=sets.map(s=>risk(tier,lp,h,s==="gr"?0:MODEL.shift[s][tier][h]));const lo=Math.min(...v),hi=Math.max(...v);res[h]=[lo,hi];rows+=`<tr><td>${tr(HK[i])}</td><td class="num" data-h="${h}">${pct(lo)} – ${pct(hi)}</td><td style="width:38%"><div class="bar"><i style="margin-left:${(100*lo).toFixed(1)}%;width:${(100*(hi-lo)).toFixed(1)}%"></i></div></td></tr>`})}
 else{HZ.forEach((h,i)=>{const sh=shiftFor(setting,tier,h);if(!Number.isFinite(sh)){rows+=`<tr><td>${tr(HK[i])}</td><td class="num" data-h="${h}">–</td><td></td></tr>`;return}
   if(setting==="nl"&&MODEL.approx.includes(tier+"|"+h))approx=true;const p=risk(tier,lp,h,sh);res[h]=p;rows+=`<tr><td>${tr(HK[i])}</td><td class="num" data-h="${h}" data-p="${p.toFixed(6)}">${pct(p)}</td><td style="width:38%"><div class="bar"><i style="width:${(100*p).toFixed(1)}%"></i></div></td></tr>`})}
 html+=`<table><thead><tr><th>${tr("r_h")}</th><th class="num">${tr("r_p")}</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
 if(approx)html+=`<p class="muted">${tr("r_approx")}</p>`;
 const mx=Math.max(0.3,...parts.map(p=>Math.abs(p[1])));parts.sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
 html+=`<h3 style="font-size:1rem;margin:16px 0 4px">${tr("r_contrib")}</h3><p class="muted">${tr("r_contrib_t")}</p><div class="contrib">`+parts.map(([k,c])=>{const w=Math.min(50,50*Math.abs(c)/mx);return `<div>${VLAB[LANG][k]}</div><div class="cbar"><i style="${c>=0?"left:50%":"right:50%"};width:${w}%;background:${c>=0?"var(--high)":"var(--low)"}"></i></div><div class="num" style="text-align:right">${c>=0?"+":"−"}${Math.abs(c).toFixed(2)}</div>`}).join("")+`</div>`;
 out.innerHTML=html;return {tier,lp,g,res}}
function validTable(){const v=MODEL.valid;$("validtable").innerHTML=`<table><thead><tr><th></th><th class="num">n</th><th class="num">C-index</th><th class="num">E/O</th></tr></thead><tbody>`+v.map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td></tr>`).join("")+`</tbody></table>`}
function example(){const e={age:74,hf:"2",vhd:"1",egfr:52,hba:11.8,dm:"1",lung:"0",hbd:11.2,los:7,dx:"4",nlr:4.2,bua:32,bud:36,np:2400,alb:3.6};$("hbu").value="gdl";$("buu").value="bun";$("npt").value="nt_pg";$("albu").value="gdl";$("neut").value="";$("lymph").value="";for(const k in e)$(k).value=e[k];calculate()}
function reset(){document.querySelectorAll("section[aria-label=Inputs] input").forEach(i=>i.value="");["hf","vhd","dm","lung","dx"].forEach(i=>$(i).value="");calculate()}
$("calc").onclick=()=>{calculate();if(window.innerWidth<900)$("results").scrollIntoView({behavior:"smooth"})};$("example").onclick=example;$("reset").onclick=reset;$("print").onclick=()=>window.print();
$("lang-en").onclick=()=>{LANG="en";applyLang()};$("lang-el").onclick=()=>{LANG="el";applyLang()};
document.querySelectorAll("section[aria-label=Inputs] input, section[aria-label=Inputs] select").forEach(e=>e.addEventListener("change",()=>calculate()));
$("build").textContent=MODEL.build;window.AILA={calculate,MODEL};applyLang();
</script>
